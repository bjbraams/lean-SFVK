name = "Main"
version = "0.1.0"
defaultTargets = ["Main"]
buildDir = ".lake/build-SFVK"

[leanOptions]
# Mathlib convention: undeclared names in statements are errors, not auto-bound implicits.
autoImplicit = false
relaxedAutoImplicit = false

[[lean_lib]]
name = "Main"
roots = ["Main", "SFVK", "SFVKMathlib"]
globs = ["Main", "SFVK", "SFVK.+", "SFVKMathlib", "SFVKMathlib.+"]

# The roadmap sketches are available as a separate, non-default build target.
[[lean_lib]]
name = "SFVKRoadmaps"
roots = ["Roadmaps"]
globs = ["Roadmaps.+"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0"

[[require]]
name = "doc-gen4"
scope = "leanprover"
rev = "v4.36.0"

[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "v4.36.0"

[[require]]
# Sibling project lean-DLMF.
name = "LeanDLMF"
path = "../lean-DLMF"
