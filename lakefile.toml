name = "Main"
version = "0.1.0"
defaultTargets = ["Main"]
buildDir = ".lake/build-SFVK"

[leanOptions]
# Mathlib convention: undeclared names in statements are errors, not auto-bound implicits.
autoImplicit = false
relaxedAutoImplicit = false

[[lean_lib]]
name = "Main"
roots = ["SFVK", "SFVKMathlib"]
globs = ["SFVK", "SFVK.+", "SFVKMathlib", "SFVKMathlib.+"]

[[lean_exe]]
name = "main"
root = "Main"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0"

[[require]]
name = "doc-gen4"
scope = "leanprover"
rev = "v4.36.0"

[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "v4.36.0"

[[require]]
# Sibling project lean-DLMF.
name = "LeanDLMF"
path = "../lean-DLMF"
